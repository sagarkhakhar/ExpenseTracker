name: expense_tracker
description: "An intelligent Expense Tracker application built with Flutter using MVVM and Clean Architecture principles."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.2.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  dartz: ^0.10.1
  collection: ^1.19.1

  # Charts
  fl_chart: ^0.66.0
  uuid: ^4.0.0

  # Image Picker
  image_picker: ^1.0.7

  # Permissions
  permission_handler: ^11.3.1

  # Device Info
  device_info_plus: ^9.1.2

  # Export and Sharing
  csv: ^5.1.1
  share_plus: ^7.2.1
  path_provider: ^2.1.2

  # File Operations
  open_file: ^3.3.2
  
  # Supabase Integration
  supabase_flutter: ^2.5.6
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

  # Linting
  flutter_lints: ^3.0.0
  mocktail: ^1.0.4
  mockito: ^5.4.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
